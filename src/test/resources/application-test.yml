spring:
  datasource:
    url: "jdbc:h2:mem:catalog_svc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS catalog_svc\\;CREATE DOMAIN IF NOT EXISTS jsonb AS TEXT"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        auto_quote_keyword: true
        default_schema: catalog_svc
  liquibase:
    enabled: false

platform:
  service:
    url: http://127.0.0.1:65535
