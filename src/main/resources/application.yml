spring:
  application:
    name: catalog-service
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 1
      maximum-pool-size: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    liquibase-schema: public
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  cloud:
    gcp:
      sql:
        enabled: false
      trace:
        enabled: true
        sampling-rate: 1.0

server:
  port: ${PORT:3004}

platform:
  service:
    url: ${PLATFORM_SERVICE_URL:http://platform-service:3002}

gcs:
  bucket: ${GCS_BUCKET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0